name: Native provider candidates
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: candidates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - provider: github
            os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - provider: github
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - provider: github
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - provider: github
            os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - provider: google
            os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - provider: google
            os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - provider: google
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - provider: google
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - provider: google
            os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Verify native host
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --release --locked --package permesh-provider-${{ matrix.provider }} --bin permesh-provider-${{ matrix.provider }} --target ${{ matrix.target }}
      - name: Exercise actual native description without credentials
        run: python scripts/smoke_provider.py --provider ${{ matrix.provider }} target/${{ matrix.target }}/release/permesh-provider-${{ matrix.provider }}${{ matrix.suffix }}
      - name: Package native binary and complete source license notices
        run: python scripts/package_provider.py --provider ${{ matrix.provider }} --target ${{ matrix.target }} --output candidate-output
      - name: Verify ZIP profile and catalog digests
        shell: bash
        run: python scripts/verify_package.py candidate-output/*.zip --entry candidate-output/catalog-entry.json
      - name: Retain unsigned candidate for release review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permesh-provider-${{ matrix.provider }}-${{ matrix.target }}-${{ github.sha }}
          path: |
            candidate-output/*.zip
            candidate-output/*.sha256
            candidate-output/catalog-entry.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
