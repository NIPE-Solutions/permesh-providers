name: Native provider candidates
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: candidates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Verify native host
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build, smoke and package each native provider
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir candidate-output
          for provider in github google cloudflare; do
            cargo build --release --locked --package "permesh-provider-$provider" --bin "permesh-provider-$provider" --target "$TARGET"
            python scripts/smoke_provider.py --provider "$provider" "target/$TARGET/release/permesh-provider-$provider$BINARY_SUFFIX"
            python scripts/package_provider.py --provider "$provider" --target "$TARGET" --output "candidate-output/$provider"
            python scripts/verify_package.py candidate-output/"$provider"/*.zip --entry "candidate-output/$provider/catalog-entry.json"
          done
      - name: Retain unsigned candidate for release review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permesh-providers-${{ matrix.target }}-${{ github.sha }}
          path: |
            candidate-output/**/*.zip
            candidate-output/**/*.sha256
            candidate-output/**/catalog-entry.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
